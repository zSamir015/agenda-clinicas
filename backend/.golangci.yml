version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      # The module path contains the Spanish word "clinicas".
      ignore-rules:
        - clinicas
  exclusions:
    generated: strict
formatters:
  enable:
    - gofmt
    - goimports
