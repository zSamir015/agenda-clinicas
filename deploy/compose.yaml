# Servicios para desarrollo local. La API, el worker y la web corren en el host.
#
# MongoDB corre como replica set de un solo nodo porque las transacciones y los
# change streams solo funcionan en replica sets. El healthcheck inicia el
# replica set la primera vez y después solo confirma que responde.
name: agenda-clinicas

services:
  mongo:
    # 8.0 es la versión con soporte largo y la que usa Atlas en el plan gratuito.
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  # Servidor SMTP falso: captura los correos y los muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo-data:
