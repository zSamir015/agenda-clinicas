          type: array
          items:
            $ref: "#/components/schemas/Practitioner"
    Room:
      type: object
      required: [id, name, roomType, active, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        roomType:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoomInput:
      type: object
