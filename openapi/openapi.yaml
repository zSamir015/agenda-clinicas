        userId:
          type: string
        name:
          type: string
        specialty:
          type: string
        serviceIds:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PractitionerInput:
      type: object
