        name:
          type: string
        durationMinutes:
          type: integer
        bufferMinutes:
          type: integer
        roomType:
          type: string
        paymentMode:
          $ref: "#/components/schemas/PaymentMode"
        priceCents:
          type: integer
          format: int64
        depositCents:
          type: integer
          format: int64
        depositPercent:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceInput:
      type: object
      required:
        - name
